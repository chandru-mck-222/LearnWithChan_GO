services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app-password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: dockerfile
    command: ["/server"]
    environment:
      PORT: "8080"
      APIVersion: ${APIVersion:-app/v1}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-text-tasks}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app-password}@rabbitmq:5672/
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: dockerfile
    command: ["/worker"]
    environment:
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-text-tasks}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app-password}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data: